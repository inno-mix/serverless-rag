[project]
name = "serverless-rag"
version = "0.1.0"
description = "Serverless RAG Document Q&A on AWS (CDK v2, Python)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["cdk.out", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations — CLAUDE.md requires type hints on all signatures
    "D",   # pydocstyle — Google-style docstrings on public shared functions
]
ignore = [
    "D203",   # incompatible with D211 (blank line before class docstring)
    "D213",   # incompatible with D212 (multi-line summary position)
    "ANN401", # boto3 clients and DynamoDB items have no static types without
              # boto3-stubs, which we are not adding (CLAUDE.md dependency rule)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests do not need docstrings or return annotations on every function.
"tests/**" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/infra"]
pythonpath = [".", "src"]
addopts = "-ra"
