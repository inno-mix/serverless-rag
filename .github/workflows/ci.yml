# CI for Serverless RAG Document Q&A
#
# Pull requests run lint + tests + `cdk synth` only — no AWS credentials are
# available to this job and none are needed (TESTING.md §1: unit and infra
# tests run with no AWS access and no network).
#
# Pushes to `main` run the same checks and then deploy via GitHub OIDC, so no
# long-lived AWS access keys are stored in the repository.
#
# The deploy job is *skipped* until AWS_DEPLOY_ROLE_ARN is defined, so `main`
# is green before any AWS setup exists. Define that variable (plus the account
# setup below) and deploys begin on the next push — this file does not change.
#
# ---------------------------------------------------------------------------
# Required GitHub repository configuration (Settings → Secrets and variables →
# Actions → Variables). These are account/repo setup and are NOT created by
# this repo's CDK app:
#
#   AWS_DEPLOY_ROLE_ARN   IAM role ARN assumed by the deploy job. Its trust
#                         policy must federate token.actions.githubusercontent.com
#                         and restrict `sub` to this repository, e.g.
#                           "repo:<owner>/<repo>:ref:refs/heads/main"
#
#                         Permissions: this role does NOT need permission to
#                         create the individual resources. A bootstrapped CDK
#                         app deploys by assuming the bootstrap roles, and
#                         CloudFormation then creates resources using the
#                         bootstrap execution role. So the role needs:
#
#                           sts:AssumeRole on arn:aws:iam::<account>:role/cdk-*
#
#                         plus, for the post-deploy smoke test, read access to
#                         discover the deployed API:
#
#                           cloudformation:DescribeStacks
#                           apigateway:GET          (reads the API key value)
#
#   AWS_REGION            Deployment region. Must match the `region` key in
#                         cdk.json (us-east-1).
#
# Optional:
#   ALERT_EMAIL           Subscribed to the CloudWatch alarms and the $5 budget.
#                         Left unset, both are still created but notify nobody.
#                         A repository variable rather than cdk.json, so no
#                         personal address is committed.
#
# Also required in the AWS account, one time:
#   * An IAM OIDC identity provider for https://token.actions.githubusercontent.com
#   * `cdk bootstrap aws://<account>/us-east-1`
#
# No secrets are required — only variables.
# ---------------------------------------------------------------------------

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  test:
    name: Lint, test, synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g aws-cdk

      # Fail-fast order per TESTING.md §6: ruff -> unit -> infra -> cdk synth.
      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      # The eval layer joins the gate because it is offline: it replays
      # embeddings recorded once from the real model, so it needs no AWS
      # credentials and is deterministic (tests/eval/record.py).
      - name: Unit, infra, and retrieval-eval tests
        run: pytest tests/unit tests/infra tests/eval -q --cov=src/shared --cov-fail-under=80

      - name: CDK synth
        run: cdk synth --quiet

      # Runs last so a CVE disclosed upstream cannot mask a real test failure,
      # but it does fail the build. The ingest Lambda parses PDFs uploaded by
      # anyone who can reach the demo, so a parser advisory is reachable by an
      # attacker rather than theoretical.
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install --quiet pip-audit
          pip-audit --progress-spinner off

  deploy:
    name: Deploy to AWS
    needs: test
    # Skipped (not failed) until AWS_DEPLOY_ROLE_ARN is set, so `main` stays
    # green before the deploy target exists. Setting the variable is the only
    # step needed to switch deploys on — no change to this file.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    # One deploy at a time. Two pushes landing together would otherwise race on
    # the same CloudFormation stacks, and the loser fails midway leaving them in
    # UPDATE_IN_PROGRESS. Scoped to this job so PR checks are unaffected, and
    # queued rather than cancelled so a superseded deploy still finishes cleanly
    # instead of being killed part-way through a stack update.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write # required for GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # `alertEmail` is passed as context rather than committed to cdk.json, so
      # no personal address enters git history. Empty is valid and means the
      # alarms and budget deploy without a notification target.
      - name: CDK deploy
        run: |
          cdk deploy --all --require-approval never \
            --context alertEmail="${{ vars.ALERT_EMAIL }}"

      # TESTING.md §6: integration tests are excluded from the PR gate because
      # they need a deployed stack, and run in the post-deploy job instead.
      # This is the only check that exercises the deployed system end to end —
      # presigned upload, indexing, retrieval, the similarity floor, deletion —
      # so a deploy that succeeds while the application is broken fails here.
      - name: Smoke test the deployment
        run: pytest tests/integration -q
